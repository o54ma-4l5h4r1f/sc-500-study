# SC-500 skills-measured outline -- the backbone of the whole system.
# Source (study guide): https://learn.microsoft.com/credentials/certifications/resources/study-guides/sc-500
# Source (cert page):    https://learn.microsoft.com/credentials/certifications/cloud-and-ai-security-engineer-associate
#
# Exam: SC-500 "Implementing End-to-End Security Controls for Cloud and AI Workloads"
#   -> Microsoft Certified: Cloud and AI Security Engineer Associate
#
# OUTLINE VERSION: the live study guide carries no "as of" date. Captured 2026-11-15 via the
# Microsoft Learn MCP (microsoft_docs_fetch of the live study guide). The exam is new: the official
# practice assessment is "not currently available" (cert page, 2026-11-15).
# Bullet text below is VERBATIM -- do not paraphrase. Question generation and the freshness diff
# both depend on exact wording.
#
# `prior_cert` values: none | soc-analyst | partial | strong. The learner has a SOC-analyst
#   background (see THE LEARNER). Sentinel collection + Security Copilot bullets are ground they
#   know -> "soc-analyst" + `quick_review = true` (short refresher page, engineer angle, never skipped).
# `hours` is the planned study allocation per bullet, weighted by exam weight x difficulty.
#   Objective hours sum to ~170 h. total_planned_hours (240) also counts the Foundations primers
#   (~22 h, week 1) and mock exams / weak-area patching (~48 h spread over weeks 5-6 + daily practice).
# `week` is the 6-week study-plan slot (see content/study-path.toml).
# `license_blocked = true` = needs licences an Azure-subscription-only lab lacks (Entra ID P1/P2,
#   Entra Suite, Microsoft 365 Copilot, Purview DSPM, Copilot Studio, Defender XDR, Security Copilot
#   capacity) -> portal tour + docs, no live lab. Initial guess; objective writers confirm.
# `high_risk` = heavy weight or highly confusable.

